<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kural Önerileri</title>
  <meta name="api-base" content="" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">KO</div>
        <div>
          <div class="brand-title">Kural Önerileri</div>
          <div class="brand-sub">DGX Demo Snapshot</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/proposals" data-route="proposals">Kural önerileri</a>
        <a href="#/decisions" data-route="decisions">Uzman kararları</a>
        <a href="#/help" data-route="help">Yardım</a>
      </nav>
      <div class="sidebar-foot">
        <div class="pill warn">Partial snapshot</div>
        <p>Veritabanına yazılmaz. Demo kararları yalnızca bu tarayıcıda saklanır. HUV ve SUT kuralları ayrı değerlendirilir.</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub" class="muted">Dondurulmuş DGX handoff görünümü</p>
        </div>
        <div class="topbar-actions">
          <span id="raw-badge" class="pill muted-pill">Ham cevap kapalı</span>
          <button type="button" id="btn-export" class="btn secondary">Kararları dışa aktar</button>
        </div>
      </header>

      <section id="view-dashboard" class="view" hidden></section>
      <section id="view-proposals" class="view" hidden></section>
      <section id="view-proposal" class="view" hidden></section>
      <section id="view-decisions" class="view" hidden></section>
      <section id="view-help" class="view" hidden></section>
      <section id="view-error" class="view" hidden>
        <div class="banner danger">Sayfa yüklenemedi.</div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
