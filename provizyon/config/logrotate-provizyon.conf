# Opsiyonel sistem logrotate parçası (root ile /etc/logrotate.d/ altına kopyalanabilir).
# Python RotatingFileHandler zaten worker/watcher dosyalarını döndürür;
# bu dosya console redirect ve results audit için ek güvenlik ağıdır.
#
#   sudo cp provizyon/config/logrotate-provizyon.conf /etc/logrotate.d/provizyon-gemma

/home/monassist1/GemmaApp/logs/provizyon-*.console.log
/home/monassist1/GemmaApp/logs/provizyon-api.log
/home/monassist1/GemmaApp/logs/provizyon-results.jsonl
/home/monassist1/GemmaApp/logs/gateway_requests.jsonl
/home/monassist1/GemmaApp/logs/medgemma.log
{
    weekly
    rotate 8
    size 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
