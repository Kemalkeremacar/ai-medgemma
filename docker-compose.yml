# GemmaApp — Docker Servisleri
# Yönetim: ./svc start|stop|restart|status|logs|config
# Not: MedGemma/vLLM bu dosyada değil — native process olarak ./svc tarafından yönetilir.

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /raid/monassist1/qdrant_storage:/qdrant/storage
    env_file:
      - ./services/qdrant/qdrant.env
    # Varsayılan düşük nofile → Actix "Too many open files" (errno 24) ile düşüyordu.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  tei-bge-m3:
    # aarch64 (DGX Spark): resmi GPU imajı yok; CPU-ARM64 + yüksek batch/thread.
    # GB10 GPU TEI: docs/TEI_GPU_ARM64.md (kaynak derleme gerekir).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    container_name: tei-bge-m3
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - /raid/monassist1/tei_data:/data
    env_file:
      - ./services/tei_bge_m3/tei.env
    command:
      - --model-id
      - BAAI/bge-m3
      - --max-batch-tokens
      - "32768"
      - --max-client-batch-size
      - "64"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    env_file:
      - ./services/open_webui/webui.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Provizyon orkestratör kuyruğu (provizyon worker + API kullanır).
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /raid/monassist1/redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"

volumes:
  open-webui-data:
    external: true
    name: open-webui
